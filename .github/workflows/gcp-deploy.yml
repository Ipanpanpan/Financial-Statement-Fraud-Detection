name: CI/CD Pipeline - GCP Artifact Registry & Cloud Run

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  GCP_REGION: us-central1
  GAR_REPOSITORY: fraud-detection-repo
  IMAGE_NAME: fraud-inference-api
  CLOUD_RUN_SERVICE: fraud-inference-service

jobs:
  # ============================================================================
  # 1. CODE QUALITY & UNIT TESTS
  # ============================================================================
  lint-and-test:
    name: Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx
          pip install -r requirements.txt

      - name: Lint with Flake8 (Syntax & Errors)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning level checks with max line length of 120
          flake8 app/ main.py --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run Test Suite with Pytest
        env:
          COMET_DISABLED: "true"
        run: |
          pytest tests/ -v

  # ============================================================================
  # 2. BUILD, PUSH TO ARTIFACT REGISTRY & DEPLOY TO CLOUD RUN
  # ============================================================================
  build-and-deploy:
    name: Build, Push & Deploy to GCP
    needs: lint-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Authentication for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construct Image Tags
        id: meta
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}"
          echo "IMAGE_SHA=${IMAGE_URI}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "IMAGE_LATEST=${IMAGE_URI}:latest" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image to GCP Artifact Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.IMAGE_SHA }}
            ${{ steps.meta.outputs.IMAGE_LATEST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Google Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          image: ${{ steps.meta.outputs.IMAGE_SHA }}
          region: ${{ env.GCP_REGION }}
          flags: |
            --port=8080
            --allow-unauthenticated
            --memory=1Gi
            --cpu=1
            --min-instances=0
            --max-instances=10
          env_vars: |
            ENVIRONMENT=production
            FRAUD_THRESHOLD=0.60
            COMET_PROJECT_NAME=financial-fraud-detection
            LOG_LEVEL=INFO
            LOG_JSON_FORMAT=true
          secrets: |
            COMET_API_KEY=COMET_API_KEY:latest

      - name: Cloud Run Deployment Summary
        run: |
          echo "=========================================================="
          echo " Deployment successful!"
          echo " Cloud Run Service URL: ${{ steps.deploy.outputs.url }}"
          echo " Image Deployed: ${{ steps.meta.outputs.IMAGE_SHA }}"
          echo "=========================================================="

